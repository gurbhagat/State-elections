<script src="js/app.js"></script>
<script src="data/constituencies.data.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/table.js"></script>
<script>
(async () => {
  const constituencies = await loadConstituencies();
  const districts = getDistricts(constituencies);

  // Populate district filter
  const distSel = document.getElementById('districtFilter');
  districts.forEach(d => { const o = document.createElement('option'); o.value = d; o.textContent = d; distSel.appendChild(o); });

  const tableData = flattenForTable(constituencies, 2022);

  // Init table
  const tbl = new DataTable({
    containerId: 'tableContainer',
    pageSize: 30,
    defaultSort: 'acNo',
    columns: [
      { key: 'acNo',     label: 'AC No.', width: '60px', className: 'num text-muted' },
      { key: 'name',     label: 'Constituency', render: (v, row) => `<a href="constituency/${row.slug}.html" class="ac-link">${v}</a>` },
      { key: 'district', label: 'District' },
      { key: 'reserved', label: 'Category', render: v => `<span class="badge badge-${(v||'').toLowerCase()}">${v}</span>` },
      { key: 'winner',   label: '2022 Winner' },
      { key: 'party',    label: '2022 Party', render: v => partyBadge(v) },
      { key: 'margin',   label: '2022 Margin', align: 'right', className: 'num', render: v => fmtNum(v) },
      { key: 'turnout',  label: 'Turnout %', align: 'right', className: 'num', render: v => v ? v.toFixed(1) + '%' : '—' }
    ]
  });
  tbl.load(tableData).sort('acNo', 'asc');

  // Wire count display
  tbl.countEl = document.getElementById('resultCount');
  tbl.paginationEl = document.getElementById('paginationWrap');
  tbl.render();

  // Search
  document.getElementById('searchInput').addEventListener('input', filterTable);
  distSel.addEventListener('change', filterTable);
  document.getElementById('categoryFilter').addEventListener('change', filterTable);
  document.getElementById('partyFilter2022').addEventListener('change', filterTable);

  function filterTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const dist = distSel.value;
    const cat = document.getElementById('categoryFilter').value;
    const party = document.getElementById('partyFilter2022').value;
    tbl.filter(row =>
      (!q || row.name.toLowerCase().includes(q) || row.winner.toLowerCase().includes(q) || row.district.toLowerCase().includes(q)) &&
      (!dist || row.district === dist) &&
      (!cat || row.reserved === cat) &&
      (!party || row.party === party)
    );
    tbl.countEl = document.getElementById('resultCount');
    tbl.paginationEl = document.getElementById('paginationWrap');
    tbl.render();
  }

  document.addEventListener('langchange', () => {
    const si = document.getElementById('searchInput');
    if (si) si.placeholder = t('search');
    const freshData = flattenForTable(constituencies, 2022);
    tbl.load(freshData).sort('acNo', 'asc');
    filterTable();
  });
})();
</script>
