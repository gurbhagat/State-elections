    <div class="ac-meta">
      <span class="badge badge-gen">General</span>
      <a href="../district/bijnor.html" style="font-size:var(--text-sm);color:var(--accent);font-weight:600;text-decoration:none" class="dist-link">Bijnor District</a>
      <span style="font-size:var(--text-sm);color:var(--text-3)">AC No. 17</span>
    </div>
    <div class="ac-share" style="display:flex;gap:var(--s-3);margin-top:var(--s-4);align-items:center">
      <span style="font-size:var(--text-xs);color:var(--text-3);font-weight:500;text-transform:uppercase;letter-spacing:0.05em" data-i18n="shareTitle">Share:</span>
      <a id="shareWA" href="#" target="_blank" class="btn btn-sm" style="background:#22c55e;color:#fff;border:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:var(--text-xs);border-radius:var(--radius-md);text-decoration:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12.004 2c-5.518 0-9.996 4.477-9.996 9.996 0 1.954.563 3.775 1.534 5.314L2 22l4.835-1.266c1.472.802 3.155 1.262 4.943 1.262 5.518 0 10-4.477 10-9.996C21.778 6.477 17.522 2 12.004 2zm4.862 13.931c-.24.679-1.396 1.246-1.921 1.293-.46.041-.95.056-1.579-.136-.391-.121-.882-.284-1.516-.554-2.697-1.144-4.437-3.877-4.572-4.056-.135-.179-1.101-1.464-1.101-2.793 0-1.329.676-1.986.917-2.235.241-.249.524-.312.699-.312.175 0 .35.002.502.009.157.008.371-.06.581.446.216.52.738 1.794.802 1.926.064.133.107.287.018.461-.088.175-.133.284-.265.437-.132.153-.277.342-.395.459-.132.131-.27.273-.117.535.153.262.68 1.116 1.458 1.808.998.889 1.839 1.163 2.102 1.294.262.132.417.11.57-.066.154-.175.656-.765.831-.102.175.765.175.765.175s.044.22.088.35c.044.13.262.656.328.787.066.13.131.262.197.394.066.13.131.262.197.394.066.131.066.241 0 .35-.066.11-.262.241-.569.371z"/></svg>

<div class="container" style="max-width:900px;margin-top:var(--s-4)">
  <div id="alertLang" class="hidden" style="background:rgba(255,103,31,0.1);border:1px solid rgba(255,103,31,0.3);color:var(--text);padding:var(--s-3) var(--s-4);border-radius:var(--radius);font-size:var(--text-sm);display:flex;justify-content:between;align-items:center;gap:12px">
    <span id="alertLangText"></span>
    <button onclick="document.getElementById('alertLang').classList.add('hidden')" style="background:none;border:none;color:var(--text-3);cursor:pointer;font-weight:700">x</button>
  </div>
</div>

<main class="section">
  <div class="container" style="max-width:900px">
    <div id="acContent"></div>
  </div>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script src="../js/app.js"></script>
<script src="../data/constituencies.data.js"></script>
<script src="../js/data-loader.js"></script>
<script src="../js/charts.js"></script>
<script>
(async () => {
  const slug = "najibabad";
  const constituencies = await loadConstituencies();
  const ac = constituencies.find(c => c.name.toLowerCase().replace(/[^a-z0-9]+/g, '-') === slug || String(c.id) === "17");
  if (!ac) return;

  function renderPage() {
    const lang = window.currentLang || 'en';
    const acName = lang === 'hi' ? (ac.nameHi || ac.name) : false ? (ac.namePa || ac.name) : ac.name;
    document.getElementById('acBreadcrumb').textContent = acName;
    document.getElementById('acTitle').textContent = acName;

    // Show dynamic translation warning if needed
    const alertBox = document.getElementById('alertLang');
    if (lang === 'hi' && !ac.nameHi) {
      document.getElementById('alertLangText').textContent = "यह पृष्ठ हिंदी में उपलब्ध नहीं है। परिणाम अंग्रेजी में दिखाए गए हैं।";
      alertBox.classList.remove('hidden');
    } else if (false && !ac.namePa) {
      document.getElementById('alertLangText').textContent = "ਇਹ ਪੰਨਾ ਪੰਜਾਬੀ ਵਿੱਚ ਉਪਲਬਧ ਨਹੀਂ ਹੈ। ਨਤੀਜੇ ਅੰਗਰੇਜ਼ੀ ਵਿੱਚ ਦਿਖਾਏ ਗਏ ਹਨ।";
      alertBox.classList.remove('hidden');
    } else {
      alertBox.classList.add('hidden');
    }

    function getWinner(r) {
      return lang === 'hi' ? (r.winnerHi || r.winner) : false ? (r.winnerPa || r.winner) : r.winner;
    }
    function getRunnerup(r) {
      return lang === 'hi' ? (r.runnerupHi || r.runnerup) : false ? (r.runnerupPa || r.runnerup) : r.runnerup;
    }

    const r22 = ac.r22 || {};
    const r17 = ac.r17 || {};

    function resultCard(year, r) {
      const wName = getWinner(r);
      const ruName = getRunnerup(r);
      return `
        <div class="result-card">
          <div class="result-card-year">${year} Result</div>
          <div class="result-card-winner">${wName || '—'}</div>
          ${partyBadge(r.party)}
          <div class="result-card-stats">
            <div class="result-card-stat"><span class="val">${fmtNum(r.votes)}</span><span class="lbl">Votes</span></div>
            <div class="result-card-stat"><span class="val">${fmtNum(r.margin)}</span><span class="lbl">Margin</span></div>
            <div class="result-card-stat"><span class="val">${r.turnout}%</span><span class="lbl">Turnout</span></div>
          </div>
          <div style="margin-top:var(--s-4);font-size:var(--text-sm);color:var(--text-3)">
            Runner-up: <strong>${ruName || '—'}</strong> ${partyBadge(r.runnerupParty || '')} (${fmtNum(r.votes ? Math.max(0, r.votes - r.margin) : 0)} votes)
          </div>
        </div>`;
    }

    const total22 = r22.totalVotes || (r22.votes + r22.margin);
    const wPct22 = total22 ? ((r22.votes / total22) * 100).toFixed(1) : 0;
    const ruVotes22 = r22.votes ? Math.max(0, r22.votes - r22.margin) : 0;
    const rrPct22 = total22 ? ((ruVotes22 / total22) * 100).toFixed(1) : 0;
    const colors = { AAP:'var(--c-aap)', INC:'var(--c-inc)', SAD:'var(--c-sad)', BJP:'var(--c-bjp)', BSP:'var(--c-bsp)', IND:'var(--c-ind)' };
    const wColor = colors[r22.party] || '#888';
    const rrColor = colors[r22.runnerupParty] || '#888';

    function renderShareBar() {
      return "";
    }

    document.getElementById('acContent').innerHTML = `
      <div class="result-cards">
        ${resultCard('2022', r22)}
        ${resultCard('2017', r17)}
      </div>

      <div class="chart-wrap" style="margin-bottom:var(--s-6)">
        <div class="chart-title">2022 Vote Share - Top Candidates</div>
        <div class="bar-chart" id="voteShareChart">
          <div class="bar-row">
            <div class="bar-label" style="width:120px;font-size:12px">${getWinner(r22)} (${r22.party})</div>
            <div class="bar-track"><div class="bar-fill" style="width:${wPct22}%;background:${wColor}"><span>${wPct22}%</span></div></div>
            <div class="bar-num" style="width:60px">${fmtNum(r22.votes)}</div>
          </div>
          <div class="bar-row">
            <div class="bar-label" style="width:120px;font-size:12px">${getRunnerup(r22)} (${r22.runnerupParty || '—'})</div>
            <div class="bar-track"><div class="bar-fill" style="width:${rrPct22}%;background:${rrColor}"><span>${rrPct22}%</span></div></div>
            <div class="bar-num" style="width:60px">${fmtNum(ruVotes22)}</div>
          </div>
        </div>
      </div>

      <div class="chart-wrap" style="margin-bottom:var(--s-6)">
        <div class="chart-title">Swing: 2017 to 2022</div>
        <div style="font-size:var(--text-sm);color:var(--text-2)">
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>2017 Winner</span><strong>${getWinner(r17)} (${r17.party})</strong></div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>2022 Winner</span><strong>${getWinner(r22)} (${r22.party})</strong></div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>2017 Margin</span><strong>${fmtNum(r17.margin)}</strong></div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>2022 Margin</span><strong>${fmtNum(r22.margin)}</strong></div>
          <div style="display:flex;justify-content:space-between;padding:8px 0"><span>Seat changed hands?</span><strong>${r17.party !== r22.party ? 'Yes — ' + r17.party + ' to ' + r22.party : 'No (retained by ' + r22.party + ')'}</strong></div>
        </div>
      </div>

      <div class="faq-section" style="margin-top:var(--s-8);padding-top:var(--s-6);border-top:1px solid var(--border);text-align:left">
        <h3 style="margin-bottom:var(--s-4)" data-i18n="faqTitle">Frequently Asked Questions</h3>
        <div class="faq-item" style="margin-bottom:var(--s-5)">
          <h4 style="margin-bottom:6px;font-size:var(--text-md);color:var(--text-1);font-weight:600" id="faqQ1"></h4>
          <p style="color:var(--text-2);font-size:var(--text-sm);line-height:1.6" id="faqA1"></p>
        </div>
        <div class="faq-item" style="margin-bottom:var(--s-5)">
          <h4 style="margin-bottom:6px;font-size:var(--text-md);color:var(--text-1);font-weight:600" id="faqQ2"></h4>
          <p style="color:var(--text-2);font-size:var(--text-sm);line-height:1.6" id="faqA2"></p>
        </div>
        <div class="faq-item" style="margin-bottom:var(--s-5)">
          <h4 style="margin-bottom:6px;font-size:var(--text-md);color:var(--text-1);font-weight:600" id="faqQ3"></h4>
          <p style="color:var(--text-2);font-size:var(--text-sm);line-height:1.6" id="faqA3"></p>
        </div>
      </div>

      <div style="margin-top:var(--s-6);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--s-4)">
        <a href="../constituencies.html" class="btn btn-secondary">All Constituencies</a>
      </div>`;

    // Dynamic FAQ logic
    const faqQ1 = lang === 'hi' ? `2022 के पंजाब चुनाव में ${acName} सीट से किसने जीत दर्ज की?` : false ? `2022 ਦੀਆਂ ਪੰਜਾਬ ਚੋਣਾਂ ਵਿੱਚ ${acName} ਸੀਟ ਤੋਂ ਕਿਸ ਨੇ ਜਿੱਤ ਪ੍ਰਾਪਤ ਕੀਤੀ?` : `Who won the 2022 election in ${acName}?`;
    const faqA1 = lang === 'hi' ? `2022 के चुनाव में \${getWinner(r22)} (\${r22.party}) ने \${fmtNum(r22.margin)} वोटों के अंतर से ${acName} निर्वाचन क्षेत्र जीता।` : false ? `2022 ਦੀਆਂ ਚੋਣਾਂ ਵਿੱਚ \${getWinner(r22)} (\${r22.party}) ਨੇ \${fmtNum(r22.margin)} ਵੋਟਾਂ ਦੇ ਫਰਕ ਨਾਲ ${acName} ਹਲਕੇ ਤੋਂ ਜਿੱਤ ਪ੍ਰਾਪਤ ਕੀਤੀ।` : `\${getWinner(r22)} (\${r22.party}) won the ${acName} constituency in the 2022 elections with a margin of \${fmtNum(r22.margin)} votes.`;

    const faqQ2 = lang === 'hi' ? `पंजाब के ${acName} निर्वाचन क्षेत्र का विधान सभा नंबर क्या है?` : false ? `ਪੰਜਾਬ ਦੇ ${acName} ਹਲਕੇ ਦਾ ਵਿਧਾਨ ਸਭਾ ਨੰਬਰ ਕੀ ਹੈ?` : `What is the assembly constituency number (AC No) of ${acName}?`;
    const faqA2 = lang === 'hi' ? `${acName} निर्वाचन क्षेत्र का विधान सभा नंबर \${ac.id || ac.acNo || '—'} है, और यह \${ac.district || '—'} जिले में आता है।` : false ? `${acName} ਹਲਕੇ ਦਾ ਵਿਧਾਨ ਸਭਾ ਨੰਬਰ \${ac.id || ac.acNo || '—'} ਹੈ, ਅਤੇ ਇਹ \${ac.district || '—'} ਜ਼ਿਲ੍ਹੇ ਅਧੀਨ ਆਉਂਦਾ ਹੈ।` : `${acName} is Assembly Constituency No. \${ac.id || ac.acNo || '—'} and is located in \${ac.district || '—'} District.`;

    const faqQ3 = lang === 'hi' ? `${acName} निर्वाचन क्षेत्र में 2022 का कुल मतदान प्रतिशत क्या था?` : false ? `2022 ਦੀਆਂ ਪੰਜਾਬ ਵਿਧਾਨ ਸਭਾ ਚੋਣਾਂ ਵਿੱਚ ${acName} ਸੀਟ 'ਤੇ ਕੁੱਲ ਵੋਟਿੰਗ ਪ੍ਰਤੀਸ਼ਤ ਕੀ ਸੀ?` : `What was the voter turnout in ${acName} in the 2022 assembly elections?`;
    const faqA3 = lang === 'hi' ? `2022 के पंजाब विधान सभा चुनाव में ${acName} सीट पर कुल मतदान प्रतिशत \${r22.turnout}% था।` : false ? `2022 ਦੀਆਂ ਪੰਜਾਬ ਵਿਧਾਨ ਸਭਾ ਚੋਣਾਂ ਵਿੱਚ ${acName} ਸੀਟ 'ਤੇ ਕੁੱਲ ਵੋਟਿੰਗ ਪ੍ਰਤੀਸ਼ਤ \${r22.turnout}% ਸੀ।` : `The voter turnout in the ${acName} constituency for the 2022 Uttar Pradesh Legislative Assembly elections was \${r22.turnout}%.`;

    document.getElementById('faqQ1').textContent = faqQ1;
    document.getElementById('faqA1').textContent = faqA1;
    document.getElementById('faqQ2').textContent = faqQ2;
    document.getElementById('faqA2').textContent = faqA2;
    document.getElementById('faqQ3').textContent = faqQ3;
    document.getElementById('faqA3').textContent = faqA3;

    // Update share links dynamically
    const shareText = encodeURIComponent(lang === 'hi' ? 
      `पंजाब विधानसभा चुनाव: \${acName} निर्वाचन क्षेत्र के परिणाम और उम्मीदवार देखें:` : 
      false ? 
      `ਪੰਜਾਬ ਵਿਧਾਨ ਸਭਾ ਚੋਣਾਂ: \${acName} ਹਲਕੇ ਦੇ ਨਤੀਜੇ ਅਤੇ ਉਮੀਦਵਾਰ ਦੇਖੋ:` : 
      `Uttar Pradesh Elections: Check results and candidates for \${acName} constituency:`);
    
    const pageUrl = encodeURIComponent(window.location.href);
    document.getElementById('shareWA').href = `https://api.whatsapp.com/send?text=\${shareText}%20\${pageUrl}`;
    document.getElementById('shareX').href = `https://twitter.com/intent/tweet?text=\${shareText}&url=\${pageUrl}`;

    // Inject FAQ Schema dynamically in head
    let schemaScript = document.getElementById('faqSchema');
    if (!schemaScript) {
      schemaScript = document.createElement('script');
      schemaScript.id = 'faqSchema';
      schemaScript.type = 'application/ld+json';
      document.head.appendChild(schemaScript);
    }
    
    const schemaObj = {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": faqQ1,
          "acceptedAnswer": {
            "@type": "Answer",
            "text": faqA1
          }
        },
        {
          "@type": "Question",
          "name": faqQ2,
          "acceptedAnswer": {
            "@type": "Answer",
            "text": faqA2
          }
        },
        {
          "@type": "Question",
          "name": faqQ3,
          "acceptedAnswer": {
            "@type": "Answer",
            "text": faqA3
          }
        }
      ]
    };
    schemaScript.textContent = JSON.stringify(schemaObj);
  }

  renderPage();
  document.addEventListener('langchange', renderPage);
})();
</script>
</body>
</html>
