<script src="../js/app.js"></script>
<script src="../data/constituencies.data.js"></script>
<script src="../js/data-loader.js"></script>
<script src="../js/charts.js"></script>
<script>
(async () => {
  const slug = "qadian";
  const constituencies = await loadConstituencies();
  const ac = constituencies.find(c => c.name.toLowerCase().replace(/[^a-z0-9]+/g, '-') === slug || String(c.id) === "6");
  if (!ac) return;

  function renderPage() {
    const lang = window.currentLang || 'en';
    const acName = lang === 'hi' ? (ac.nameHi || ac.name) : lang === 'pa' ? (ac.namePa || ac.name) : ac.name;
    document.getElementById('acBreadcrumb').textContent = acName;
    document.getElementById('acTitle').textContent = acName;

    function getWinner(r) {
      return lang === 'hi' ? (r.winnerHi || r.winner) : lang === 'pa' ? (r.winnerPa || r.winner) : r.winner;
    }
    function getRunnerup(r) {
      return lang === 'hi' ? (r.runnerupHi || r.runnerup) : lang === 'pa' ? (r.runnerupPa || r.runnerup) : r.runnerup;
    }

    const r22 = ac.r22 || {};
    const r17 = ac.r17 || {};

    function resultCard(year, r) {
      const wName = getWinner(r);
      const ruName = getRunnerup(r);
      return `
        <div class="result-card">
          <div class="result-card-year">${year} Result</div>
          <div class="result-card-winner">${wName || '—'}</div>
          ${partyBadge(r.party)}
          <div class="result-card-stats">
            <div class="result-card-stat"><span class="val">${fmtNum(r.votes)}</span><span class="lbl">Votes</span></div>
            <div class="result-card-stat"><span class="val">${fmtNum(r.margin)}</span><span class="lbl">Margin</span></div>
            <div class="result-card-stat"><span class="val">${r.turnout}%</span><span class="lbl">Turnout</span></div>
          </div>
          <div style="margin-top:var(--s-4);font-size:var(--text-sm);color:var(--text-3)">
            Runner-up: <strong>${ruName || '—'}</strong> ${partyBadge(r.runnerupParty || '')} (${fmtNum(r.votes ? Math.max(0, r.votes - r.margin) : 0)} votes)
          </div>
        </div>`;
    }

    const total22 = r22.totalVotes || (r22.votes + r22.margin);
    const wPct22 = total22 ? ((r22.votes / total22) * 100).toFixed(1) : 0;
    const ruVotes22 = r22.votes ? Math.max(0, r22.votes - r22.margin) : 0;
    const rrPct22 = total22 ? ((ruVotes22 / total22) * 100).toFixed(1) : 0;
    const colors = { AAP:'var(--c-aap)', INC:'var(--c-inc)', SAD:'var(--c-sad)', BJP:'var(--c-bjp)', BSP:'var(--c-bsp)', IND:'var(--c-ind)' };
    const wColor = colors[r22.party] || '#888';
    const rrColor = colors[r22.runnerupParty] || '#888';

    document.getElementById('acContent').innerHTML = `
      <div style="margin-bottom:var(--s-4)">${renderShareBar()}</div>
      <div class="result-cards">
        ${resultCard('2022', r22)}
        ${resultCard('2017', r17)}
      </div>

      <div class="chart-wrap" style="margin-bottom:var(--s-6)">
        <div class="chart-title">2022 Vote Share — Top Candidates</div>
        <div class="bar-chart" id="voteShareChart">
          <div class="bar-row">
            <div class="bar-label" style="width:120px;font-size:12px">${getWinner(r22)} (${r22.party})</div>
            <div class="bar-track"><div class="bar-fill" style="width:${wPct22}%;background:${wColor}"><span>${wPct22}%</span></div></div>
            <div class="bar-num" style="width:60px">${fmtNum(r22.votes)}</div>
          </div>
          <div class="bar-row">
            <div class="bar-label" style="width:120px;font-size:12px">${getRunnerup(r22)} (${r22.runnerupParty || '—'})</div>
            <div class="bar-track"><div class="bar-fill" style="width:${rrPct22}%;background:${rrColor}"><span>${rrPct22}%</span></div></div>
            <div class="bar-num" style="width:60px">${fmtNum(ruVotes22)}</div>
          </div>
        </div>
      </div>

      <div class="chart-wrap" style="margin-bottom:var(--s-6)">
        <div class="chart-title">Swing: 2017 to 2022</div>
        <div style="font-size:var(--text-sm);color:var(--text-2)">
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>2017 Winner</span><strong>${getWinner(r17)} (${r17.party})</strong></div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>2022 Winner</span><strong>${getWinner(r22)} (${r22.party})</strong></div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>2017 Margin</span><strong>${fmtNum(r17.margin)}</strong></div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>2022 Margin</span><strong>${fmtNum(r22.margin)}</strong></div>
          <div style="display:flex;justify-content:space-between;padding:8px 0"><span>Seat changed hands?</span><strong>${r17.party !== r22.party ? 'Yes — ' + r17.party + ' to ' + r22.party : 'No (retained by ' + r22.party + ')'}</strong></div>
        </div>
      </div>

      <div style="margin-top:var(--s-6);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--s-4)">
        <a href="../constituencies.html" class="btn btn-secondary">All Constituencies</a>
        ${renderShareBar()}
      </div>`;
  }

  renderPage();
  document.addEventListener('langchange', renderPage);
})();
</script>
</body>
</html>
