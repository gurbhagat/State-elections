  <style>
    .districts-hero {
      background: linear-gradient(135deg, var(--bg) 0%, var(--surface) 100%);
      border-bottom: 1px solid var(--border);
      padding: var(--s-12) 0 var(--s-10);
    }
    .districts-hero-inner { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s-6); flex-wrap: wrap; }
    .districts-stats-row { display: flex; gap: var(--s-6); flex-wrap: wrap; margin-top: var(--s-6); }
    .dstat { text-align: center; }
    .dstat-num { font-size: var(--text-3xl,2rem); font-weight: 800; color: var(--text); line-height: 1; }
    .dstat-lbl { font-size: var(--text-xs); color: var(--text-3); text-transform: uppercase; letter-spacing: .8px; font-weight: 600; margin-top: 4px; }

    .district-search-wrap { margin-bottom: var(--s-6); }
    .district-search {
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: var(--s-3) var(--s-4);
      font-size: var(--text-base);
      color: var(--text);
      outline: none;
      transition: border-color var(--transition);
    }
    .district-search:focus { border-color: var(--accent); }
    .district-search::placeholder { color: var(--text-3); }

    .district-grid-v2 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: var(--s-5);
    }

    .district-card-v2 {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg, 12px);
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      position: relative;
    }
    .district-card-v2:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      border-color: var(--border-2);
    }
    .district-card-v2:hover .dc-arrow { opacity: 1; transform: translateX(0); }

    .dc-stripe { height: 4px; width: 100%; }
    .dc-body { padding: var(--s-5); }
    .dc-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-2); margin-bottom: var(--s-4); }
    .dc-name { font-size: var(--text-base); font-weight: 700; color: var(--text); line-height: 1.2; }
    .dc-arrow {
      color: var(--text-3); font-size: 1rem; opacity: 0;
      transform: translateX(-4px);
      transition: opacity .18s, transform .18s;
      flex-shrink: 0; margin-top: 2px;
    }

    .dc-bar { height: 8px; background: var(--surface-3); border-radius: 100px; margin-bottom: var(--s-4); overflow: hidden; display: flex; }
    .dc-bar-seg { height: 100%; transition: width .5s cubic-bezier(.4,0,.2,1); }

    .dc-legend { display: flex; gap: var(--s-3); flex-wrap: wrap; margin-bottom: var(--s-4); }
    .dc-leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-2); font-weight: 500; }
    .dc-leg-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

    .dc-stats { display: flex; gap: 0; border-top: 1px solid var(--border); }
    .dc-stat { flex: 1; padding: var(--s-3) var(--s-4); text-align: center; border-right: 1px solid var(--border); }
    .dc-stat:last-child { border-right: none; }
    .dc-stat-val { font-size: var(--text-sm); font-weight: 700; color: var(--text); display: block; }
    .dc-stat-lbl { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; margin-top: 1px; }

    .no-results { text-align: center; padding: 64px; color: var(--text-3); grid-column: 1/-1; }

    @media (max-width: 640px) {
      .district-grid-v2 { grid-template-columns: 1fr 1fr; gap: var(--s-3); }
      .dc-body { padding: var(--s-4); }
      .dc-legend { display: none; }
    }
    @media (max-width: 400px) {
      .district-grid-v2 { grid-template-columns: 1fr; }
    }
  </style>

  <script>

    googletag.cmd.push(function() {
      googletag.defineSlot('/130702287/Leaderboard', [728, 90], 'ad-slot-container').addService(googletag.pubads());
      googletag.setConfig({singleRequest: true});
      googletag.enableServices();

  </script>

<body>

<header class="site-header" id="siteHeader"></header>







<div class="districts-hero">
  <div class="container">
    <span class="page-eyebrow" data-i18n="heroEyebrow">Punjab Assembly Election</span>
    <div class="districts-hero-inner">
      <div>
        <h1 class="page-title" data-i18n="navDistricts">District-wise View</h1>
        <p class="page-desc" data-i18n="districtsDesc">Punjab has 23 districts with a total of 117 assembly constituencies. Click a district to explore its seats and 2022 results.</p>
      </div>
    </div>
    <div class="districts-stats-row">
      <div class="dstat"><div class="dstat-num">23</div><div class="dstat-lbl">Districts</div></div>
      <div class="dstat"><div class="dstat-num">117</div><div class="dstat-lbl">Constituencies</div></div>
      <div class="dstat"><div class="dstat-num">34</div><div class="dstat-lbl">SC Reserved</div></div>
      <div class="dstat"><div class="dstat-num">2022</div><div class="dstat-lbl">Latest Election</div></div>
    </div>
  </div>
</div>


<div class="ad-wrap-content" style="display:flex;justify-content:center;margin:20px auto;max-width:100%;overflow:hidden;">
  <div id="ad-slot-container" style="width: 728px; height: 90px;">
    <script>
      googletag.cmd.push(function() { googletag.display('ad-slot-container'); });
    </script>
  </div>
</div>

<main class="section">
  <div class="container">

    <div class="district-search-wrap">
      <input type="search" id="districtSearch" class="district-search" placeholder="🔍  Search districts…" autocomplete="off">
    </div>

    <div class="district-grid-v2" id="districtGrid">
      <div style="text-align:center;padding:64px;color:var(--text-3);grid-column:1/-1">Loading districts…</div>
    </div>

  </div>
</main>







<footer class="site-footer" id="siteFooter"></footer>

<script src="js/app.js"></script>
<script src="data/constituencies.data.js"></script>
<script src="data/districts.data.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/table.js"></script>
<script>
const partyColors = {
  AAP: '#DD2222', INC: '#19AAED', SAD: '#1A237E', BJP: '#FF671F',
  BSP: '#1B4FBB', IND: '#888', JJKP: '#6D28D9', CPM: '#CC0000'
};

(async () => {
  const [constituencies] = await Promise.all([loadConstituencies()]);

  const distMap = {};
  constituencies.forEach(c => {
    const d = c.district;
    if (!distMap[d]) distMap[d] = { seats: 0, scSeats: 0, parties: {} };
    distMap[d].seats++;
    if (c.reserved === 'SC') distMap[d].scSeats++;
    const p = c.r22.party;
    distMap[d].parties[p] = (distMap[d].parties[p] || 0) + 1;
  });

  Object.values(distMap).forEach(d => {
    d.partiesSorted = Object.entries(d.parties).sort((a,b) => b[1]-a[1]);
    d.topParty = d.partiesSorted[0];
  });

  const sortedDistricts = [...new Set(constituencies.map(c => c.district))].sort();
  const grid = document.getElementById('districtGrid');

  function slugify(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

  function renderCards(list) {
    if (!list.length) {
      grid.innerHTML = '<div class="no-results">No districts match your search.</div>';
      return;
    }
    grid.innerHTML = list.map(distName => {
      const d = distMap[distName];
      const slug = slugify(distName);
      const topColor = partyColors[d.topParty?.[0]] || '#888';

      const barSegs = d.partiesSorted.map(([p, s]) => {
        const pct = (s / d.seats * 100).toFixed(1);
        return `<div class="dc-bar-seg" style="width:${pct}%;background:${partyColors[p]||'#888'}" title="${p}: ${s} seat${s>1?'s':''}"></div>`;
      }).join('');

      const legendItems = d.partiesSorted.slice(0, 3).map(([p, s]) =>
        `<div class="dc-leg-item"><div class="dc-leg-dot" style="background:${partyColors[p]||'#888'}"></div>${p} ${s}</div>`
      ).join('');

      return `<a class="district-card-v2" href="district/${slug}.html">
        <div class="dc-stripe" style="background:${topColor}"></div>
        <div class="dc-body">
          <div class="dc-header">
            <div class="dc-name">${distName}</div>
            <div class="dc-arrow">→</div>
          </div>
          <div class="dc-bar">${barSegs}</div>
          <div class="dc-legend">${legendItems}</div>
        </div>
        <div class="dc-stats">
          <div class="dc-stat">
            <span class="dc-stat-val">${d.seats}</span>
            <span class="dc-stat-lbl">Seats</span>
          </div>
          <div class="dc-stat">
            <span class="dc-stat-val">${d.scSeats}</span>
            <span class="dc-stat-lbl">SC</span>
          </div>
          <div class="dc-stat">
            <span class="dc-stat-val">${d.topParty?.[0] || '—'}</span>
            <span class="dc-stat-lbl">Leading</span>
          </div>
        </div>
      </a>`;
    }).join('');
  }

  renderCards(sortedDistricts);

  document.getElementById('districtSearch').addEventListener('input', function() {
    const q = this.value.trim().toLowerCase();
    const filtered = q ? sortedDistricts.filter(n => n.toLowerCase().includes(q)) : sortedDistricts;
    renderCards(filtered);
  });
})();
</script>
</body>
</html>
